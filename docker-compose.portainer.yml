# ============================================================
# static-pages — NGINX (site) + File Browser (/admin)
# Variante para orquestradores GitOps (Portainer, Coolify…) e para
# rodar atrás de um proxy na MESMA rede Docker, sem publicar porta.
#
# Diferenças para o docker-compose.yml:
#   - sem bind mount de arquivo nem env_file (o GitOps não os materializa):
#     as variáveis entram por "environment:" (cadastre-as na stack ou use
#     os padrões abaixo);
#   - serviços só com build:, sem "image:" (o "Re-pull image" não tenta
#     baixar a imagem de um registry);
#   - backup com imagem própria (Dockerfile.backup) e volume nomeado;
#   - sem porta no host: o proxy acessa o container pelo nome
#     (static-pages) na rede fixa "static-pages-net";
#   - limites de CPU e memória.
#
# A stack precisa estar no ar ANTES de reimplantar o proxy que a referencia.
# Para publicar a porta (teste local):
#   docker compose -f docker-compose.portainer.yml -f docker-compose.portainer.local.yml up -d --build
# ============================================================
name: static-pages

services:
  app:
    build:
      context: .
      args:
        APK_HTTP: ${APK_HTTP:-false}
    container_name: static-pages
    restart: unless-stopped
    environment:
      FB_ADMIN_USER: ${FB_ADMIN_USER:-admin}
      FB_ADMIN_PASSWORD: ${FB_ADMIN_PASSWORD:-}
      FB_SYNC_ADMIN_PASSWORD: ${FB_SYNC_ADMIN_PASSWORD:-true}
      FB_BRANDING_NAME: ${FB_BRANDING_NAME:-Static Pages}
      FB_LOCALE: ${FB_LOCALE:-pt-br}
      SITE_SANDBOX: ${SITE_SANDBOX:-true}
      SITE_NOINDEX: ${SITE_NOINDEX:-false}
      # Prefixo público quando o proxy publica o app num caminho (ex.: /pages). Vazio = raiz.
      SP_BASE: ${SP_BASE:-}
      # Login Microsoft (Entra ID): vazios = desligado
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      TEAM_QUOTA_MB: ${TEAM_QUOTA_MB:-200}
      LIXEIRA_DIAS: ${LIXEIRA_DIAS:-30}
      VISITAS_DIAS: ${VISITAS_DIAS:-30}
    volumes:
      - srv:/srv
      - db:/database
    networks:
      - static-pages-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diário dos volumes (somente leitura nos dados) para o volume "backups"
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: static-pages-backup
    restart: unless-stopped
    environment:
      TZ: ${BACKUP_TZ:-<-03>3}          # Brasília (sem horário de verão), sem tzdata
      BACKUP_HORA: ${BACKUP_HORA:-3}
      BACKUP_MANTER: ${BACKUP_MANTER:-7}
      BACKUP_NA_SUBIDA: ${BACKUP_NA_SUBIDA:-true}
    volumes:
      - srv:/data/srv:ro
      - db:/data/db:ro
      - backups:/backups
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  srv:
  db:
  backups:

# Rede com nome FIXO (não depende do nome da pasta/projeto): o proxy a
# referencia como external no compose dele.
networks:
  static-pages-net:
    name: static-pages-net
