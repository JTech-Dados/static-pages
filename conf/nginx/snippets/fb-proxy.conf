# $request_uri (original, com o prefixo público): o File Browser roda com
# baseURL = $sp_base/admin e espera receber o caminho completo
proxy_pass http://127.0.0.1:8080$request_uri;
proxy_http_version 1.1;

proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Prefix $sp_base/admin;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Uploads grandes (default do nginx é 1m) e longos
client_max_body_size 0;
proxy_request_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
