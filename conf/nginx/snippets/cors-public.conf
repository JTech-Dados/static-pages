# Com o CSP sandbox, as páginas do site rodam numa origem opaca
# ("null"): um fetch() para o próprio servidor vira cross-origin.
# Liberar leitura pública do SITE (nunca do /admin) permite que a
# home monte o menu automático a partir de /_pastas/ e meta.json.
# Sem credenciais: cookies/tokens não são enviados nem expostos.
add_header Access-Control-Allow-Origin "*" always;
