# ============================================================
# /         -> conteúdo estático de /srv
# /admin/   -> File Browser em 127.0.0.1:8080
# /healthz  -> healthcheck do container
#
# Prefixo público (SP_BASE, ex.: /pages): atrás de um proxy que publica
# o app num caminho (https://<domínio>/pages/). O entrypoint gera
# snippets/base.conf, que define $sp_base e remove o prefixo da URI
# (rewrite) ANTES da escolha do location — então todas as locations
# abaixo continuam escritas como se o app estivesse na raiz. Só o que
# volta para o navegador ou vai para o File Browser (que conhece o
# prefixo pelo baseURL) usa $sp_base.
# ============================================================

# Upgrade de WebSocket só quando o cliente pede
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Visitas a páginas (para o contador da home e da tela de Times):
# só GET com 200, fora do /admin e de rotas internas (/_...), e só
# pastas ou .html — assets, JSON e erros não contam.
map "$request_method:$status:$uri" $sp_visita {
    default 0;
    "~^GET:200:/(?!admin(/|$)|_)[^.]*$"          1;
    "~^GET:200:/(?!admin(/|$)|_).*\.[hH][tT][mM][lL]?$" 1;
}
log_format sp_visita '$time_iso8601\t$uri';

# Gravações (POST/PUT, e PATCH do tus: a interface cria o envio sem tamanho e manda os bytes no PATCH) passam pela checagem de cota; leituras e remoções não dependem do sp-auth
map $request_method $sp_escrita {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
}

# Time da URI (já sem o prefixo público): 1º segmento, com ou sem /_pastas/ na frente. Chave do marcador
# /database/restritos/<time>; nunca vazio nem com "/" ou ".." (o NGINX já normalizou o $uri).
map $uri $sp_time {
    default "__sem_time__";
    "~^/(?:_pastas/)?(?<t>[^/.][^/]*)(?:/|$)" $t;
}

# Página (pasta do 1º nível do time): "time/pagina", com ou sem /_pastas/ na frente. Marcador de página
# restrita: /database/restritos/_p/<time>/<pagina>. Nunca começa com "." nem tem "/" no nome.
map $uri $sp_pag {
    default "__sem_pagina__";
    "~^/(?:_pastas/)?(?<t>[^/.][^/]*)/(?<p>[^/.][^/]*)(?:/|$)" "$t/$p";
}


# Anti força-bruta no login do File Browser (5 tentativas/min por IP, rajada de 10:
# atrás de um proxy/gateway vários usuários podem chegar com o mesmo IP)
limit_req_zone $binary_remote_addr zone=fblogin:10m rate=5r/m;
# Endpoints públicos do login Microsoft (sp-auth): /login e /solicitar validam um token e podem criar
# pedido de acesso — limite por IP contra abuso (as demais rotas do sp-auth exigem sessão e NÃO
# levam limite: são chamadas a cada página e, atrás de um proxy, o IP é compartilhado)
limit_req_zone $binary_remote_addr zone=entra:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /srv;
    # Linux diferencia maiúsculas: aceita as variações comuns de
    # nome vindas de upload (Index.html, INDEX.HTML...)
    index index.html index.htm Index.html Index.htm INDEX.html INDEX.HTML INDEX.HTM;

    server_tokens off;
    charset utf-8;

    # $sp_base + rewrite do prefixo público (gerado pelo entrypoint)
    include /etc/nginx/snippets/base.conf;

    # Time restrito? O sp-auth cria e remove o arquivo-marcador /database/restritos/<time> quando se liga
    # ou desliga o acesso restrito; um stat por requisição, sem reload e sem janela fail-open.
    set $sp_r 0;
    if (-e /database/restritos/$sp_time) { set $sp_r 1; }
    if (-e /database/restritos/_p/$sp_pag) { set $sp_r 1; }

    # access_log no server substitui o herdado: repete o padrão (stdout)
    access_log /var/log/nginx/access.log main;
    access_log /database/visitas.log sp_visita if=$sp_visita;

    # Redirects relativos: evita "http://" atrás do proxy TLS do Coolify
    absolute_redirect off;
    port_in_redirect off;


    # ========================================================
    # IP real do cliente (atrás do Traefik/Caddy do Coolify)
    # Confia apenas em proxies de redes privadas.
    # ========================================================
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;


    # ========================================================
    # Compressão
    # ========================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;


    # ========================================================
    # Headers de segurança
    #
    # add_header NÃO é herdado por locations que declaram o seu
    # próprio add_header — por isso cada location inclui os
    # snippets explicitamente.
    # ========================================================
    include /etc/nginx/snippets/security-headers.conf;


    # ========================================================
    # Healthcheck
    # ========================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }


    # ========================================================
    # Dotfiles (.env, .git, .htaccess enviados por upload)
    # ========================================================
    # Exceção: o .time.json da raiz de cada time é público (só nome e
    # cota) para a home agrupar as páginas por time. Precisa vir ANTES
    # da regra de dotfiles: regex são avaliadas na ordem do arquivo.
    location ~ ^/[^/.][^/]*/\.time\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri @sem_meta;
    }

    location ~ /\. {
        return 404;
    }

    # Contagem de visitas (gerada a cada 5 min pelo entrypoint)
    location = /_visitas.json {
        alias /database/visitas.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
    }

    # Pastas internas: lixeira e backups nunca são servidas no site
    location ^~ /_lixeira/ { return 404; }
    location ^~ /_backup/  { return 404; }

    # ========================================================
    # File Browser
    # ========================================================
    location = /admin {
        return 301 $sp_base/admin/;
    }

    location = /admin/api/login {
        limit_req zone=fblogin burst=10 nodelay;
        include /etc/nginx/snippets/fb-proxy.conf;
    }

    # Tela de Times (estática, usa a API do File Browser com o
    # token do admin logado). Mesma origem do /admin de propósito.
    location = /admin/times {
        alias /usr/share/static-pages/times/times.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    # scripts e modelos da tela (inject.js, times-tabs.js, modelo-time.html)
    location ^~ /admin/times/ {
        alias /usr/share/static-pages/times/;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Histórico de atividade (auditoria.log) — só para admins.
    # O "porteiro" é a própria API do File Browser: /api/users só
    # responde 200 para admin; qualquer outro token recebe 401/403.
    location = /admin/_auditoria {
        auth_request /_auth_admin;
        alias /database/auditoria.log;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /_auth_admin {
        internal;
        proxy_pass http://127.0.0.1:8080$sp_base/admin/api/users;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Auth $http_x_auth;
    }

    # Login Microsoft (Entra ID): ponte para o sp-auth (Node, 127.0.0.1:8090).
    # Públicos: /config, /login e /solicitar (validam o ID token). Com sessão: /me, /nomes, /pedidos*
    # (o próprio sp-auth confere o X-Auth contra a API do File Browser). Prefixo comum (sem ^~) para
    # a regex abaixo valer; é mais específico que /admin/, que é ^~ de prefixo menor.
    location ~ ^/admin/entra/(login|solicitar|api/sessao|site/entrar|site/pedir)$ {
        limit_req zone=entra burst=30 nodelay;
        include /etc/nginx/snippets/entra-proxy.conf;
    }
    # Redirect URI padrão do login Microsoft (popup do MSAL): página vazia, só recebe a resposta
    location = /admin/entra/retorno {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><meta charset="utf-8"><title>Entrando…</title>';
    }
    # a decisão do gate é só do NGINX (subrequisição interna); de fora não existe
    location = /admin/entra/site/auth { return 404; }
    location /admin/entra/ {
        include /etc/nginx/snippets/entra-proxy.conf;
    }

    # Cota do time: antes de gravar (POST/PUT) o NGINX pergunta ao sp-auth se o arquivo cabe. Só as
    # escritas fazem a consulta ($sp_escrita => 418 => @fb_escrita): listar, baixar e apagar não
    # dependem do sp-auth. Estourou: o sp-auth responde 403 e o NGINX devolve 413 com a mensagem
    # abaixo (o painel a mostra). auth_request não vale dentro de "if" nem de limit_except.
    location = /_cota {
        internal;
        # a subrequisição herda o Content-Length do upload: sem isto o limite padrão (1 MB) devolvia 413
        # para o auth_request e o NGINX respondia 500 em qualquer envio maior que 1 MB
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:8090/admin/entra/cota;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Auth $http_x_auth;
        proxy_set_header X-Method $request_method;
        proxy_set_header X-Content-Length $content_length;
        proxy_set_header X-Upload-Length $http_upload_length;
    }
    location @cota_excedida {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 413 "O espaço do seu time acabou: a cota foi excedida. Apague arquivos antigos ou peça mais espaço a um admin.";
    }
    # o 403 do auth_request acontece numa location alcançada por error_page (418): precisa disto
    recursive_error_pages on;
    location @fb_escrita {
        # sem Content-Length (chunked) a cota não enxerga o tamanho do corpo: recusa
        default_type text/plain;
        if ($http_transfer_encoding ~* chunked) { return 411 "Envie o Content-Length (sem Transfer-Encoding: chunked)."; }
        auth_request /_cota;
        error_page 403 = @cota_excedida;
        include /etc/nginx/snippets/fb-proxy.conf;
    }
    location ^~ /admin/api/resources {
        error_page 418 = @fb_escrita;
        if ($sp_escrita) { return 418; }
        include /etc/nginx/snippets/fb-proxy.conf;
    }
    location ^~ /admin/api/tus {
        error_page 418 = @fb_escrita;
        if ($sp_escrita) { return 418; }
        include /etc/nginx/snippets/fb-proxy.conf;
    }

    # Guia de publicação (página estática da imagem), pública
    location = /_ajuda { return 301 $sp_base/_ajuda/; }
    location ^~ /_ajuda/ {
        alias /usr/share/static-pages/guia/;
        default_type text/plain;   # publicar.py e afins abrem como texto
        index index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Espaço usado (barra do menu): o File Browser mostra o disco da máquina. O sp-auth responde:
    # membro vê o espaço do time (pasta x cota); admin recebe a resposta nativa do File Browser.
    location ^~ /admin/api/usage {
        rewrite ^ /admin/entra/usage break;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Auth $http_x_auth;
        proxy_set_header X-Orig-Uri $request_uri;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # custom.css do painel (branding): revalida sempre. Sem isso o navegador mantém o CSS antigo
    # e o painel fica metade no visual novo (inject.js) e metade no antigo. Exato: vem antes de /admin/.
    location = /admin/static/custom.css {
        include /etc/nginx/snippets/fb-proxy.conf;
        proxy_hide_header Cache-Control;   # o File Browser manda "public, max-age=86400"
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ^~ impede que a regex de assets estáticos (abaixo) capture
    # /admin/static/*.js|css — eles precisam ir para o File Browser
    location ^~ /admin/ {
        include /etc/nginx/snippets/fb-proxy.conf;

        # injeta o inject.js no painel: menu Acessos, barra superior e colunas (só no HTML)
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter "</body>" "<script src=\"$sp_base/admin/times/inject.js\" defer></script></body>";
    }


    # ========================================================
    # Lista de pastas (JSON) para o menu automático da home
    #
    # /_pastas/          -> lista /srv/
    # /_pastas/teste/    -> lista /srv/teste/  (subpastas)
    # "index" aponta para um nome inexistente para o NGINX listar
    # em vez de servir index.html. O NGINX normaliza ".." antes do
    # match, e a regra de dotfiles (acima) vem primeiro.
    # ========================================================
    location ~ ^/_pastas(?<sub>/.*)?/$ {
        # time restrito: a lista de arquivos também é restrita (401; a home trata como "restrito")
        # error_page num location substitui as do server (herança): repete as de erro padrão
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 418 = @restrito_aux;
        if ($sp_r) { return 418; }
        alias /srv$sub/;
        index __nenhum__;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
    }


    # meta.json é opcional: se a pasta não tiver, responde 204
    # vazio em vez de 404 (a home trata como "sem metadados")
    location ~ ^/.+/meta\.json$ {
        # error_page num location substitui as do server (herança): repete as de erro padrão
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 418 = @restrito_aux;
        if ($sp_r) { return 418; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri @sem_meta;
    }
    location @sem_meta {
        include /etc/nginx/snippets/cors-public.conf;
        return 204;
    }


    # ========================================================
    # Assets estáticos com cache
    # ========================================================
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        # error_page num location substitui as do server (herança): repete as de erro padrão
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 418 = @site_restrito;   # time restrito: sem cache público e com o gate de acesso
        if ($sp_r) { return 418; }
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri =404;
    }


    # ========================================================
    # Home e favicon vêm da imagem (/usr/share/static-pages/home) e cada deploy os
    # atualiza; com HOME_FROM_SRV=true vêm do /srv (snippets/home-root.conf, gerado no boot).
    # ========================================================
    location ~ ^/(?:index\.html)?$ {
        include /etc/nginx/snippets/home-root.conf;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
    }
    location = /favicon.svg {
        include /etc/nginx/snippets/home-root.conf;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
    }


    # ========================================================
    # Site estático
    #
    # /            -> index.html
    # /pagina      -> pagina.html
    # /pagina.html -> pagina.html
    # ========================================================
    location / {
        # error_page num location substitui as do server (herança): repete as de erro padrão
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 418 = @site_restrito;
        if ($sp_r) { return 418; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri $uri.html $uri/ =404;
    }


    # ========================================================
    # Time restrito (acesso por login Microsoft; v1: por time, cookie Lax, só navegação)
    #
    # Chega aqui via "if ($sp_r) { return 418; }". O gate (sp-auth) confere o cookie do time:
    # 200 = serve o arquivo; 401/403 = página de entrada (status mantido). Se o sp-auth cair, o
    # auth_request falha e o NGINX responde 500 sem servir conteúdo (falha fechado).
    # add_header não é herdado: os cabeçalhos do restrito são todos repetidos aqui.
    # ========================================================
    location @site_restrito {
        auth_request /_site_auth;
        error_page 401 =401 @site_entrar;
        error_page 403 =403 @site_entrar;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        add_header Cache-Control "private, no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/restrito-headers.conf;
        include /etc/nginx/snippets/site-sandbox-restrito.conf;
        try_files $uri $uri.html $uri/ =404;
    }
    location = /_site_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/admin/entra/site/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Orig-Uri $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location @site_entrar {
        root /usr/share/static-pages/home;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/restrito-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        # __SP_BASE__ e __TIME__ viram o prefixo público e o time (slug já validado pelo sp-auth)
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter "__SP_BASE__" "$sp_base";
        sub_filter "__TIME__" "$sp_time";
        try_files /entrar.html =404;
    }
    # lista de pastas e meta.json de um time restrito: 401 em JSON, com CORS (a home precisa ler o status)
    location @restrito_aux {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/cors-public.conf;
        return 401 '{"erro":"restrito"}';
    }


    # ========================================================
    # Páginas de erro
    # 404.html vem da imagem (home/) ou do /srv com HOME_FROM_SRV=true; 50x.html da imagem nginx
    # ========================================================
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/home-root.conf;
        # meta.json ausente cai aqui: sem CORS o fetch da home gera erro no console
        include /etc/nginx/snippets/cors-public.conf;
        # a página aparece em qualquer profundidade de URL: __SP_BASE__ vira o prefixo público
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter "__SP_BASE__" "$sp_base";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
