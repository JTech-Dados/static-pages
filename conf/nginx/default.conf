# ============================================================
# /         -> conteúdo estático de /srv
# /admin/   -> File Browser em 127.0.0.1:8080
# /healthz  -> healthcheck do container
#
# OBS: o prefixo /admin está fixo aqui. Se mudar FB_BASEURL,
# ajuste as locations /admin abaixo também.
# ============================================================

# Upgrade de WebSocket só quando o cliente pede
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Anti força-bruta no login do File Browser (5 tentativas/min por IP)
limit_req_zone $binary_remote_addr zone=fblogin:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /srv;
    # Linux diferencia maiúsculas: aceita as variações comuns de
    # nome vindas de upload (Index.html, INDEX.HTML...)
    index index.html index.htm Index.html Index.htm INDEX.html INDEX.HTML INDEX.HTM;

    server_tokens off;
    charset utf-8;

    # Redirects relativos: evita "http://" atrás do proxy TLS do Coolify
    absolute_redirect off;
    port_in_redirect off;


    # ========================================================
    # IP real do cliente (atrás do Traefik/Caddy do Coolify)
    # Confia apenas em proxies de redes privadas.
    # ========================================================
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;


    # ========================================================
    # Compressão
    # ========================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;


    # ========================================================
    # Headers de segurança
    #
    # add_header NÃO é herdado por locations que declaram o seu
    # próprio add_header — por isso cada location inclui os
    # snippets explicitamente.
    # ========================================================
    include /etc/nginx/snippets/security-headers.conf;


    # ========================================================
    # Healthcheck
    # ========================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }


    # ========================================================
    # Dotfiles (.env, .git, .htaccess enviados por upload)
    # ========================================================
    location ~ /\. {
        return 404;
    }


    # ========================================================
    # File Browser
    # ========================================================
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/api/login {
        limit_req zone=fblogin burst=5 nodelay;
        include /etc/nginx/snippets/fb-proxy.conf;
    }

    # Tela de Times (estática, usa a API do File Browser com o
    # token do admin logado). Mesma origem do /admin de propósito.
    location = /admin/times {
        alias /usr/share/static-pages/times/times.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /admin/times/inject.js {
        alias /usr/share/static-pages/times/inject.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ^~ impede que a regex de assets estáticos (abaixo) capture
    # /admin/static/*.js|css — eles precisam ir para o File Browser
    location ^~ /admin/ {
        include /etc/nginx/snippets/fb-proxy.conf;

        # injeta o item "Times" no menu do painel (só no HTML)
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter "</body>" "<script src=\"/admin/times/inject.js\" defer></script></body>";
    }


    # ========================================================
    # Lista de pastas (JSON) para o menu automático da home
    #
    # /_pastas/          -> lista /srv/
    # /_pastas/teste/    -> lista /srv/teste/  (subpastas)
    # "index" aponta para um nome inexistente para o NGINX listar
    # em vez de servir index.html. O NGINX normaliza ".." antes do
    # match, e a regra de dotfiles (acima) vem primeiro.
    # ========================================================
    location ~ ^/_pastas(?<sub>/.*)?/$ {
        alias /srv$sub/;
        index __nenhum__;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
    }


    # meta.json é opcional: se a pasta não tiver, responde 204
    # vazio em vez de 404 (a home trata como "sem metadados")
    location ~ ^/.+/meta\.json$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri @sem_meta;
    }
    location @sem_meta {
        include /etc/nginx/snippets/cors-public.conf;
        return 204;
    }


    # ========================================================
    # Assets estáticos com cache
    # ========================================================
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri =404;
    }


    # ========================================================
    # Site estático
    #
    # /            -> index.html
    # /pagina      -> pagina.html
    # /pagina.html -> pagina.html
    # ========================================================
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/site-sandbox.conf;
        include /etc/nginx/snippets/cors-public.conf;
        try_files $uri $uri.html $uri/ =404;
    }


    # ========================================================
    # Páginas de erro
    # 404.html vem de /srv (seed); 50x.html da imagem nginx
    # ========================================================
    error_page 404 /404.html;
    location = /404.html {
        internal;
        # meta.json ausente cai aqui: sem CORS o fetch da home gera erro no console
        include /etc/nginx/snippets/cors-public.conf;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
