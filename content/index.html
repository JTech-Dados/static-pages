<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container no ar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Tokens: DESIGN.md (Vercel) */
    :root {
      --ink: #171717; --body: #4d4d4d; --mute: #888888;
      --hairline: #ebebeb; --canvas: #ffffff; --canvas-soft: #fafafa;
      --sans: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: var(--sans); color: var(--ink); background: var(--canvas-soft);
      position: relative; overflow: hidden;
    }
    /* mesh gradient: decoração só em escala de hero */
    body::before {
      content: ""; position: absolute; inset: -20%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(40% 40% at 30% 35%, #007cf033, transparent 70%),
        radial-gradient(35% 35% at 70% 30%, #ff008026, transparent 70%),
        radial-gradient(40% 40% at 60% 75%, #00dfd833, transparent 70%),
        radial-gradient(30% 30% at 25% 75%, #f9cb2826, transparent 70%);
      filter: blur(40px);
    }
    main {
      position: relative; z-index: 1; text-align: center; padding: 48px 24px;
      animation: enter 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--body);
      padding: 4px 10px; border-radius: 9999px; background: var(--canvas);
      box-shadow: inset 0 0 0 1px #00000014, 0 1px 1px #00000005, 0 2px 2px #0000000a;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #0070f3; box-shadow: 0 0 0 3px #d3e5ff; }
    h1 {
      margin: 24px 0 8px; font-size: clamp(32px, 6vw, 48px); line-height: 1;
      font-weight: 600; letter-spacing: -0.05em; text-wrap: balance;
    }
    p { margin: 0; font-size: 18px; line-height: 28px; color: var(--body); text-wrap: pretty; }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow"><span class="dot" aria-hidden="true"></span>200 OK</span>
    <h1>Container no ar.</h1>
    <p>Substitua este arquivo pelo seu site em <code style="font-family:var(--mono);font-size:15px">/admin</code>.</p>
  </main>
</body>
</html>
