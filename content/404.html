<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Página não encontrada</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Tokens: DESIGN.md (Vercel) */
    :root {
      --ink: #171717; --body: #4d4d4d; --mute: #888888;
      --hairline: #ebebeb; --canvas: #ffffff; --canvas-soft: #fafafa;
      --sans: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: var(--sans); color: var(--ink); background: var(--canvas-soft);
    }
    main { display: flex; align-items: center; gap: 24px; padding: 24px; }
    .code {
      font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.96px;
      padding-right: 24px; border-right: 1px solid var(--hairline);
    }
    p { margin: 0 0 12px; font-size: 14px; line-height: 20px; color: var(--body); }
    a {
      display: inline-flex; align-items: center; height: 32px; padding: 0 12px;
      font-size: 14px; font-weight: 500; color: #fff; background: var(--ink);
      border-radius: 6px; text-decoration: none;
      transition-property: background-color, transform; transition-duration: 150ms; transition-timing-function: ease-out;
    }
    a:hover { background: #000; }
    a:active { transform: scale(0.96); }
    a:focus-visible { outline: 2px solid #0070f3; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div>
      <p>Esta página não foi encontrada.</p>
      <a href="/">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
